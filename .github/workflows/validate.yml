name: Validate Site and PHP Examples

on:
  push:
    branches: [main]
  pull_request:

jobs:
  site-checks:
    name: Astro Checks, Tests, and Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build

  php-examples:
    name: PHP Example Validation (${{ matrix.php-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.4', '8.5']
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP ${{ matrix.php-version }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: node scripts/validate-examples.mjs
